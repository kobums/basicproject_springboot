# 개발용 DB. 값은 .env 에서 읽는다 (.env.example 복사).
# db/schema.sql 은 볼륨이 비어 있을 때(처음 뜰 때)만 실행된다. 다시 만들려면 docker compose down -v.
#   docker compose up -d db                  DB 만 (서버는 ./gradlew bootRun)
#   docker compose --profile api up -d --build   DB + Spring 서버 (Dockerfile)
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    profiles: ["api"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8081
    ports:
      - "${PORT:-8081}:8081"
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
